name: Feature request / 功能建议
description: 提出一个新功能或改进
labels: [ enhancement ]
body:
  - type: textarea
    id: need
    attributes:
      label: 你想解决什么问题
      description: 描述使用场景，而不只是「加一个按钮」
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
  - type: input
    id: monitor
    attributes:
      label: 相关显示器型号 / 连接方式（如适用）
