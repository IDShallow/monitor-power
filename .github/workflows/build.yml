name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: tools\build.cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor-power
          if-no-files-found: error
          path: dist/monitor-power.exe
