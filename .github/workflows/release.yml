name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: tools\build.cmd

      - name: Checksums
        shell: pwsh
        run: |
          $exe = "dist/monitor-power.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLower()
          "$hash  monitor-power.exe" | Set-Content -Encoding ASCII -Path dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/monitor-power.exe
            dist/SHA256SUMS.txt
